[package]
name = "wlsnip"
version = "0.1.0"
edition = "2024"
description = "A high-performance Wayland screenshot utility"
license = "MIT"

[dependencies]
# CLI
clap = { version = "4.6", features = ["derive"] }

# Wayland
wayland-client = "0.31.2"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# XDG Portal (D-Bus)
ashpd = { version = "0.13", features = ["screenshot"] }
tokio = { version = "1", features = ["rt", "macros"] }

# OS / Paths
directories = "5.0"

# Error handling
thiserror = "2"

# OS primitives
nix = { version = "0.30", features = ["fs", "mman"] }
libc = "0.2"
rayon = "1.12.0"
zune-png = "0.5.2"
turbojpeg = { version = "1.4.0", default-features = false, features = ["cmake", "pkg-config"] }
wl-clipboard-rs = "0.9.3"
zune-core = "0.5.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify-rust = "4.11"
webp = "0.3.1"
font8x8 = "0.3.1"
toml = "1.1.2"
[profile.release]
opt-level = 3
lto = true
strip = true

[build-dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6.5"
clap_mangen = "0.3.0"
